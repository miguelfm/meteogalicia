id = "miguelfm/meteogalicia"
name = "MeteoGalicia"
version = "1.1.0"
plugin_api = 22
author = "miguelfm"
license = "MIT"
icon = "cloud-rain"
description = "Plugin persoal e non oficial para Noctalia que amosa datos meteorolóxicos das APIs públicas de MeteoGalicia."
tags = ["bar", "panel", "weather", "galicia", "indicator"]
dependencies = []

# ── Axustes do plugin ────────────────────────────────────────────────────────

[[setting]]
key = "language"
type = "select"
label_key = "settings.language.label"
description_key = "settings.language.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.language.option.auto" },
  { value = "gl", label_key = "settings.language.option.gl" },
  { value = "en", label_key = "settings.language.option.en" },
]

[[setting]]
key = "concello_id"
type = "int"
label_key = "settings.concello_id.label"
description_key = "settings.concello_id.description"
default = 15035

[[setting]]
key = "concello_name"
type = "string"
label_key = "settings.concello_name.label"
description_key = "settings.concello_name.description"
default = "Fene"

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 30
min = 5
max = 180
step = 5

[[setting]]
key = "show_town_name"
type = "bool"
label_key = "settings.show_town_name.label"
description_key = "settings.show_town_name.description"
default = false

[[setting]]
key = "show_rain_prob"
type = "bool"
label_key = "settings.show_rain_prob.label"
description_key = "settings.show_rain_prob.description"
default = true

[[setting]]
key = "show_hourly_cards"
type = "bool"
label_key = "settings.show_hourly_cards.label"
description_key = "settings.show_hourly_cards.description"
default = false

[[setting]]
key = "hours_count"
type = "int"
label_key = "settings.hours_count.label"
description_key = "settings.hours_count.description"
default = 48
min = 12
max = 48
step = 12

[[setting]]
key = "show_daily_summary"
type = "bool"
label_key = "settings.show_daily_summary.label"
description_key = "settings.show_daily_summary.description"
default = true

[[setting]]
key = "show_daily_hourly_curve"
type = "bool"
label_key = "settings.show_daily_hourly_curve.label"
description_key = "settings.show_daily_hourly_curve.description"
default = true

[[setting]]
key = "ui_scale"
type = "select"
label_key = "settings.ui_scale.label"
description_key = "settings.ui_scale.description"
default = "large"
options = [
  { value = "normal", label_key = "settings.ui_scale.option.normal" },
  { value = "large", label_key = "settings.ui_scale.option.large" },
  { value = "xlarge", label_key = "settings.ui_scale.option.xlarge" },
]

[[setting]]
key = "panel_opacity"
type = "select"
label_key = "settings.panel_opacity.label"
description_key = "settings.panel_opacity.description"
default = "opaque"
options = [
  { value = "opaque", label_key = "settings.panel_opacity.option.opaque" },
  { value = "subtle", label_key = "settings.panel_opacity.option.subtle" },
  { value = "glass", label_key = "settings.panel_opacity.option.glass" },
]

# ── Entradas (Service, Widget, Panel) ─────────────────────────────────────────

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  right = "plugin miguelfm/meteogalicia:poller all refresh"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 1400
height = 1000
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
capture_keys = [
  "escape",
  "r",
  "s",
  "c",
  "left",
  "right",
  "Page_Up",
  "Page_Down",
  "Prior",
  "Next",
  "Home",
  "End",
  "bracketleft",
  "bracketright",
]
